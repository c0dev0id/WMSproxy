name: Check

# Pre-merge gate: lint, unit tests and an unminified debug build on every branch
# push. There is no pull_request trigger: a check run attaches to the head commit, so
# the push run's result already shows on a PR, and adding the event only produces a
# second run whenever a PR is opened onto an already-built branch. The signed,
# minified release build and the `dev` pre-release stay in build.yml, which runs only
# on push to main.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Two pushes in quick succession: the newer run cancels the older, so a superseded
# build does not sit on a runner producing a result nobody wants.
concurrency:
  group: check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A real certificate is supplied out of band, never committed: the key ends up in
      # the published APK and is therefore effectively public, but keeping it out of the
      # repository stops automated scanners reporting it and triggering a revocation.
      # Without the secret the build keeps the self-signed certificate in assets, so the
      # repository still builds for anyone.
      - name: Install TLS certificate if configured
        env:
          TLS_KEYSTORE_P12_BASE64: ${{ secrets.TLS_KEYSTORE_P12_BASE64 }}
          TLS_HOST: ${{ vars.TLS_HOST }}
        run: |
          if [ -n "$TLS_KEYSTORE_P12_BASE64" ] && [ -n "$TLS_HOST" ]; then
            # Whitespace is stripped first: base64 tools differ on line wrapping (GNU
            # wraps at 76 columns unless told not to, BSD needs -b 0), and a wrapped
            # secret would otherwise decode differently depending on which produced it.
            printf '%s' "$TLS_KEYSTORE_P12_BASE64" | tr -d '[:space:]' | base64 -d > app/src/main/assets/localhost.p12
            echo "TLS_HOST_ARG=-PtlsHost=$TLS_HOST" >> "$GITHUB_ENV"
            echo "Using supplied certificate for $TLS_HOST"
          else
            echo "No TLS secret configured; keeping the self-signed certificate"
          fi

      # One Gradle invocation rather than separate jobs: the tasks share
      # compileDebugKotlin and a single daemon start-up, and lintDebug covers one
      # variant instead of lint's debug + release. `test` (not testDebugUnitTest)
      # because :core is a plain JVM module whose tests the Android-variant task would
      # skip. --continue reports lint, test and compile failures from the same run
      # instead of stopping at the first.
      #
      # assembleRelease is here despite this being the branch gate, because it is the
      # only task that runs R8. A missing-class or shrinking failure is invisible in a
      # debug build and would otherwise surface only after merging to main, where it
      # blocks the release everyone installs from. No signing secrets are passed, so the
      # APK comes out unsigned — the point is running the minifier, not shipping it.
      - name: Lint, test and build
        run: ./gradlew --continue $TLS_HOST_ARG lintDebug test assembleDebug assembleRelease

      # The project cannot be built locally, so this is the only way to get a branch
      # onto the device. It installs beside the release build (.debug applicationId).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            core/build/reports/tests/test
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
