name: Catalogue

# Rebuilds the catalogue the app ships (app/src/main/assets/catalog.json): the document
# of every library service, read with the app's own parser. Runs when the library, the
# tool or this file changes, on any branch, and by hand when a server changed; the
# result is committed to the branch it ran on. A push made with the workflow token
# starts no other workflow, so the next real push runs Check with the asset in place.
on:
  push:
    paths:
      - app/src/main/assets/library.json
      - tool/**
      - .github/workflows/catalog.yml
  workflow_dispatch:

# A second run on the same branch supersedes the first; both would commit the same file.
concurrency:
  group: catalogue-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The tool exits 1 when a service could not be read, after writing the asset with
      # the rest; the commit below still lands, and the job is marked at the end.
      - name: Read every library service
        id: read
        continue-on-error: true
        run: ./gradlew :tool:run

      - name: Commit the catalogue
        run: |
          git config user.name c0dev0id
          git config user.email sh+git@codevoid.de
          git add app/src/main/assets/catalog.json
          if git diff --cached --quiet; then
            echo "The catalogue is unchanged."
          else
            git commit -m "Refresh the bundled catalogue"
            git push
          fi

      - name: Report unreadable services
        if: steps.read.outcome == 'failure'
        run: |
          echo "Some services could not be read; see the step above."
          exit 1
