name: Build

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # `test` rather than testDebugUnitTest: :core is a plain JVM module, and the
      # Android-variant task does not reach it.
      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            core/build/reports/tests/test
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # A real certificate is supplied out of band, never committed: the key ends up in
      # the published APK and is therefore effectively public, but keeping it out of the
      # repository stops automated scanners reporting it and triggering a revocation.
      # Without the secret the build keeps the self-signed certificate in assets, so the
      # repository still builds for anyone.
      - name: Install TLS certificate if configured
        env:
          TLS_KEYSTORE_P12_BASE64: ${{ secrets.TLS_KEYSTORE_P12_BASE64 }}
          TLS_HOST: ${{ vars.TLS_HOST }}
        run: |
          if [ -n "$TLS_KEYSTORE_P12_BASE64" ] && [ -n "$TLS_HOST" ]; then
            # Whitespace is stripped first: base64 tools differ on line wrapping (GNU
            # wraps at 76 columns unless told not to, BSD needs -b 0), and a wrapped
            # secret would otherwise decode differently depending on which produced it.
            printf '%s' "$TLS_KEYSTORE_P12_BASE64" | tr -d '[:space:]' | base64 -d > app/src/main/assets/localhost.p12
            echo "TLS_HOST_ARG=-PtlsHost=$TLS_HOST" >> "$GITHUB_ENV"
            echo "Using supplied certificate for $TLS_HOST"
          else
            echo "No TLS secret configured; keeping the self-signed certificate"
          fi

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ./gradlew assembleRelease $TLS_HOST_ARG \
            -PappVersionName="dev-${SHORT_SHA}" \
            -PappVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4.1.3
        with:
          name: app-release

      - name: Rename APK
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          mv app-release.apk "wmsproxy-dev-${SHORT_SHA}.apk"
          echo "apk_name=wmsproxy-dev-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      - name: Delete existing dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev --yes 2>/dev/null || true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          body: |
            Automated development build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            This is a pre-release snapshot — not intended for production use.
          draft: false
          prerelease: true
          make_latest: false
          files: ${{ env.apk_name }}
