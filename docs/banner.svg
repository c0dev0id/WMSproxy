<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14503F"/>
      <stop offset="100%" stop-color="#1B6B5A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7FD6B8"/>
      <stop offset="100%" stop-color="#C4F0DF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <rect width="800" height="1" fill="#FFFFFF" opacity="0.08"/>

  <!-- The launcher icon: four map tiles with a route through them -->
  <g transform="translate(50 37) scale(3) translate(-33 -33)" fill="none" stroke="#FFFFFF" stroke-linejoin="round">
    <path stroke-width="3" d="M36,33 h12 a3,3 0 0 1 3,3 v12 a3,3 0 0 1 -3,3 h-12 a3,3 0 0 1 -3,-3 v-12 a3,3 0 0 1 3,-3 z M60,33 h12 a3,3 0 0 1 3,3 v12 a3,3 0 0 1 -3,3 h-12 a3,3 0 0 1 -3,-3 v-12 a3,3 0 0 1 3,-3 z M36,57 h12 a3,3 0 0 1 3,3 v12 a3,3 0 0 1 -3,3 h-12 a3,3 0 0 1 -3,-3 v-12 a3,3 0 0 1 3,-3 z M60,57 h12 a3,3 0 0 1 3,3 v12 a3,3 0 0 1 -3,3 h-12 a3,3 0 0 1 -3,-3 v-12 a3,3 0 0 1 3,-3 z"/>
    <path stroke-width="5" stroke-linecap="round" d="M39,69 C39,58 47,54 54,54 C61,54 69,50 69,39"/>
  </g>

  <text x="220" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="68" fill="#FFFFFF" letter-spacing="1">WMSproxy</text>
  <rect x="222" y="124" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="222" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="20" fill="#CFE5DE">WMS, WMTS and ArcGIS as XYZ tiles</text>

  <!-- Tile grid decoration -->
  <g transform="translate(652 36)" fill="none" stroke="#FFFFFF">
    <g opacity="0.22" stroke-width="2">
      <rect x="0" y="0" width="40" height="40" rx="6"/>
      <rect x="48" y="0" width="40" height="40" rx="6"/>
      <rect x="96" y="0" width="40" height="40" rx="6"/>
      <rect x="0" y="48" width="40" height="40" rx="6"/>
      <rect x="48" y="48" width="40" height="40" rx="6"/>
      <rect x="96" y="48" width="40" height="40" rx="6"/>
    </g>
    <g opacity="0.1" stroke-width="2">
      <rect x="0" y="96" width="40" height="40" rx="6"/>
      <rect x="48" y="96" width="40" height="40" rx="6"/>
      <rect x="96" y="96" width="40" height="40" rx="6"/>
    </g>
    <path opacity="0.35" stroke-width="5" stroke-linecap="round" d="M20,116 C20,90 44,68 68,68 C92,68 116,46 116,20"/>
  </g>
</svg>
