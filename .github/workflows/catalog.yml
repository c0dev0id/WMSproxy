name: Catalogue

# Rebuilds the catalogue the app ships (app/src/main/assets/catalog.json): the document
# of every library service, read with the app's own parser. Runs when the library, the
# parser, the tool or this file changes, on any branch, and by hand when a server
# changed; the result is committed to the branch it ran on. A push made with the
# workflow token starts no other workflow, so the next real push runs Check with the
# asset in place.
on:
  push:
    paths:
      - app/src/main/assets/library.json
      - core/src/main/**
      - tool/**
      - .github/workflows/catalog.yml
  workflow_dispatch:

# A second run on the same branch supersedes the first; both would commit the same file.
concurrency:
  group: catalogue-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the tool
        run: ./gradlew :tool:installDist

      # Exit 1 means a service could not be read and kept its previous document, which
      # is a warning once the asset is committed; anything else means the tool did not
      # finish, which fails the job at the end. Run directly rather than through Gradle
      # so the exit status is the tool's own.
      - name: Read every library service
        id: read
        run: |
          set +e
          tool/build/install/tool/bin/tool
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit the catalogue
        run: |
          git config user.name c0dev0id
          git config user.email sh+git@codevoid.de
          git add app/src/main/assets/catalog.json
          if git diff --cached --quiet; then
            echo "The catalogue is unchanged."
          else
            git commit -m "Refresh the bundled catalogue"
            git push
          fi

      - name: Report
        run: |
          case "${{ steps.read.outputs.status }}" in
            0) echo "Every service was read." ;;
            1) echo "::warning::Some services could not be read and keep their previous document; see the read step." ;;
            *) echo "::error::The tool did not finish; see the read step."; exit 1 ;;
          esac
